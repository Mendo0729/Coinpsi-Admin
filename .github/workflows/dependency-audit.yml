name: Verificación de dependencias

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Auditar vulnerabilidades moderadas o superiores
        run: npm audit --audit-level=moderate
      - name: Generar build estático
        run: npm run build
